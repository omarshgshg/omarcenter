<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز عمر | Omar Center</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ff4655;
            --bg-color: #0f1923;
            --card-bg: #1f2326;
            --text-color: #ece8e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            background-image: linear-gradient(rgba(15, 25, 35, 0.85), rgba(15, 25, 35, 0.95)), 
                              url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
        }

        header {
            background-color: rgba(15, 25, 35, 0.95);
            padding: 15px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary-color);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .search-container {
            flex-grow: 1;
            max-width: 400px;
            position: relative;
        }

        .search-container input {
            width: 100%;
            padding: 10px 40px 10px 15px;
            border-radius: 25px;
            border: 1px solid #333;
            background-color: var(--card-bg);
            color: white;
            font-size: 15px;
        }

        .search-container i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
        }

        nav {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        nav a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 16px;
            transition: 0.3s;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 5px;
        }

        nav a:hover {
            background-color: var(--primary-color);
            color: white;
        }

        .hero {
            text-align: center;
            padding: 60px 20px;
            background: linear-gradient(0deg, var(--bg-color) 0%, transparent 100%);
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: 3em;
            margin-bottom: 15px;
            color: var(--primary-color);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .hero p {
            font-size: 1.2em;
            color: #aaa;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto 40px auto;
            padding: 0 20px;
        }

        .admin-panel {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 40px;
            border: 1px solid #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .admin-panel h3 {
            margin-bottom: 20px;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        input, select, button {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #2a2e33;
            color: white;
            outline: none;
            flex: 1;
            min-width: 200px;
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
        }

        button {
            background-color: var(--primary-color);
            cursor: pointer;
            font-weight: bold;
            border: none;
            transition: 0.3s;
            flex: unset;
            min-width: 150px;
        }

        button:hover {
            background-color: #d43b48;
            transform: scale(1.05);
        }

        .section-title {
            font-size: 26px;
            margin: 50px 0 25px 0;
            border-right: 5px solid var(--primary-color);
            padding-right: 15px;
            background: linear-gradient(90deg, rgba(255,70,85,0.1) 0%, transparent 100%);
            padding-top: 10px;
            padding-bottom: 10px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .product-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            transition: 0.3s;
            border: 1px solid #333;
            text-align: center;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
            border-color: var(--primary-color);
        }

        .delete-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(255, 0, 0, 0.8);
            color: white;
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            min-width: unset;
            padding: 0;
            z-index: 10;
        }

        .delete-btn:hover {
            background-color: red;
        }

        .product-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background-color: #2a2e33;
            border-bottom: 1px solid #333;
        }

        .product-info {
            padding: 25px 20px;
        }

        .product-title {
            font-size: 20px;
            margin-bottom: 10px;
            color: #fff;
        }

        .product-price {
            color: var(--primary-color);
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .buy-btn {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            background-color: #25D366; /* لون واتساب */
            color: white;
            font-weight: bold;
            transition: 0.3s;
        }

        .buy-btn:hover {
            background-color: #1ebe57;
            transform: scale(1.02);
        }

        footer {
            text-align: center;
            padding: 50px 20px;
            background-color: #090e14;
            margin-top: 60px;
            border-top: 1px solid #222;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 25px;
        }

        .social-links a {
            color: var(--text-color);
            font-size: 30px;
            transition: 0.3s;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: var(--card-bg);
            border: 1px solid #333;
        }

        .social-links a:hover {
            color: white;
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            transform: translateY(-5px);
        }

        /* رسالة عند عدم العثور على منتج في البحث */
        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            color: #888;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Omar Center</div>
        <div class="search-container">
            <i class="fas fa-search"></i>
            <input type="text" id="search-input" placeholder="ابحث عن أجهزة، ألعاب، بطاقات..." onkeyup="searchProducts()">
        </div>
        <nav id="navbar-categories">
            <!-- سيتم إضافة الأقسام هنا ديناميكياً -->
        </nav>
    </header>

    <div class="hero">
        <h1>مرحباً بكم في مركز عمر</h1>
        <p>الوجهة الأولى لأحدث أجهزة وإكسسوارات الألعاب الإلكترونية</p>
    </div>

    <div class="container">
        
        <!-- لوحة تحكم لإضافة الأقسام والمنتجات -->
        <div class="admin-panel">
            <h3><i class="fas fa-cog"></i> لوحة الإدارة (إضافة عناصر)</h3>
            
            <div class="input-group">
                <input type="text" id="new-category" placeholder="اسم القسم الجديد (مثل: ألعاب PS5)">
                <button onclick="addCategory()"><i class="fas fa-plus"></i> إضافة قسم</button>
            </div>

            <div class="input-group">
                <input type="text" id="prod-name" placeholder="اسم المنتج">
                <input type="text" id="prod-price" placeholder="السعر (مثال: 50$)">
                <input type="text" id="prod-image" placeholder="رابط صورة المنتج (URL)">
                <select id="prod-category">
                    <!-- سيتم تعبئة الأقسام هنا -->
                </select>
                <button onclick="addProduct()"><i class="fas fa-plus"></i> إضافة منتج</button>
            </div>
        </div>

        <div id="store-content">
            <!-- سيتم عرض الأقسام والمنتجات هنا -->
        </div>

    </div>

    <footer>
        <div class="social-links">
            <a href="https://wa.me/9647801492079" target="_blank" title="واتساب"><i class="fab fa-whatsapp"></i></a>
            <a href="https://instagram.com/omar._center" target="_blank" title="إنستغرام"><i class="fab fa-instagram"></i></a>
            <a href="https://tiktok.com/@omar._center" target="_blank" title="تيك توك"><i class="fab fa-tiktok"></i></a>
        </div>
        <p>جميع الحقوق محفوظة &copy; 2026 مركز عمر | Omar Center.</p>
    </footer>

    <script>
        let categories = JSON.parse(localStorage.getItem('omar_categories')) || ['أجهزة الكونسول', 'اكسسوارات'];
        let products = JSON.parse(localStorage.getItem('omar_products')) || [
            { id: 1, name: "PlayStation 5", price: "500$", image: "https://images.unsplash.com/photo-1606813907291-d86efa9b94db?w=500", category: "أجهزة الكونسول" },
            { id: 2, name: "Xbox Series S", price: "300$", image: "https://images.unsplash.com/photo-1605901309584-818e25960b8f?w=500", category: "أجهزة الكونسول" }
        ];

        function renderApp() {
            renderNav();
            renderAdminCategories();
            renderStore(products); // تمرير المنتجات للعرض
            saveData();
        }

        function renderNav() {
            const nav = document.getElementById('navbar-categories');
            nav.innerHTML = categories.map(cat => `<a href="#${cat}">${cat}</a>`).join('');
        }

        function renderAdminCategories() {
            const select = document.getElementById('prod-category');
            select.innerHTML = categories.map(cat => `<option value="${cat}">${cat}</option>`).join('');
        }

        function renderStore(productsToDisplay) {
            const store = document.getElementById('store-content');
            store.innerHTML = '';

            categories.forEach(cat => {
                const catProducts = productsToDisplay.filter(p => p.category === cat);
                
                // عرض القسم فقط إذا كان يحتوي على منتجات أو إذا لم يكن هناك بحث جاري
                if(catProducts.length > 0 || productsToDisplay.length === products.length) {
                    let sectionHTML = `<h2 class="section-title" id="${cat}">${cat}</h2>`;
                    sectionHTML += `<div class="products-grid">`;
                    
                    if(catProducts.length === 0) {
                        sectionHTML += `<p style="color: #888;">لا توجد منتجات في هذا القسم حالياً.</p>`;
                    } else {
                        catProducts.forEach(prod => {
                            sectionHTML += `
                                <div class="product-card">
                                    <button class="delete-btn" onclick="deleteProduct(${prod.id})" title="حذف المنتج"><i class="fas fa-trash"></i></button>
                                    <img src="${prod.image}" alt="${prod.name}" class="product-image" onerror="this.src='https://via.placeholder.com/250x200?text=Omar+Center'">
                                    <div class="product-info">
                                        <h3 class="product-title">${prod.name}</h3>
                                        <div class="product-price">${prod.price}</div>
                                        <a href="https://wa.me/9647801492079?text=مرحباً، أريد الاستفسار عن منتج: ${prod.name}" target="_blank" class="buy-btn">
                                            <i class="fab fa-whatsapp"></i> اطلب الآن
                                        </a>
                                    </div>
                                </div>
                            `;
                        });
                    }
                    
                    sectionHTML += `</div>`;
                    store.innerHTML += sectionHTML;
                }
            });

            if (store.innerHTML === '') {
                store.innerHTML = `<div class="no-results">لم يتم العثور على منتجات مطابقة لبحثك.</div>`;
            }
        }

        function addCategory() {
            const newCat = document.getElementById('new-category').value.trim();
            if(newCat && !categories.includes(newCat)) {
                categories.push(newCat);
                document.getElementById('new-category').value = '';
                renderApp();
            }
        }

        function addProduct() {
            const name = document.getElementById('prod-name').value.trim();
            const price = document.getElementById('prod-price').value.trim();
            const image = document.getElementById('prod-image').value.trim() || 'https://via.placeholder.com/250x200?text=Omar+Center';
            const category = document.getElementById('prod-category').value;
            const id = Date.now(); // إنشاء ID فريد للمنتج

            if(name && price) {
                products.push({ id, name, price, image, category });
                document.getElementById('prod-name').value = '';
                document.getElementById('prod-price').value = '';
                document.getElementById('prod-image').value = '';
                renderApp();
            } else {
                alert("يرجى إدخال اسم وسعر المنتج.");
            }
        }

        function deleteProduct(id) {
            if(confirm("هل أنت متأكد من حذف هذا المنتج؟")) {
                products = products.filter(p => p.id !== id);
                renderApp();
            }
        }

        function searchProducts() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const filteredProducts = products.filter(prod => 
                prod.name.toLowerCase().includes(searchTerm)
            );
            renderStore(filteredProducts);
        }

        function saveData() {
            localStorage.setItem('omar_categories', JSON.stringify(categories));
            localStorage.setItem('omar_products', JSON.stringify(products));
        }

        // تشغيل الموقع
        renderApp();
    </script>
</body>
</html>
